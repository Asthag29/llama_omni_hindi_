data:
  speech_dir: "data/speech"  # {train,validation,test}/*.parquet + manifest.json, from build_stage2_local
  shuffle_buffer_size: 1024  # rows per worker shuffle buffer (~0.2 MB/row on average -> ~200 MB/worker)
  seed: 42
  mel_size: 128
  # DataLoader workers per GPU. `datasets` gives each worker a disjoint set of
  # parquet files, so every row is read and yielded exactly once per pass
  # (stage2.py no longer filters rows by index). Workers beyond the number of
  # files stay idle; nothing is lost or duplicated.
  num_workers: 2

model:
  config_path: "models/llama"
  model_base: "models/llama"
  tokenizer_path: "models/llama"
  init_checkpoint: outputs/stage_1/backbone_text/best_model
  model_max_length: 2048

training:
  num_train_epochs: 3
  batch_size: 2
  gradient_accumulation_steps: 7
  learning_rate: 1.0e-4
  tune_speech_projector: true
  tune_llm_backbone: true
  tune_speech_encoder: false
  use_lora: true
  lora_r: 128
  lora_alpha: 64
  lora_dropout: 0.05
  gradient_checkpointing: true
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.8
  # Base model and forward pass follow this value; trainable weights and optimizer
  # state are always fp32. Do not use "bf16-true"/"16-true" (they cast everything).
  precision: "bf16-mixed"
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  log_every_n_steps: 20
  val_check_interval: 0.25
  fast_dev_run: false
  attn_implementation: "sdpa"

logging:
  output_dir: "outputs/stage_2/speech_text"
  csv: true
  tensorboard: false
  wandb: true
  wandb_project: "hindi_llama_omni"
  wandb_run_id: null
  wandb_run_name: "stage-2-speech-text"
  # Best = lowest val_loss. During a fit: checkpoints/best -> best-so-far weights (from
  # the first real validation), checkpoints/last -> latest validation (if save_last).
  # After a completed fit: best_model/ and final_model/.
  save_last: true

hydra:
  run:
    dir: ${logging.output_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${logging.output_dir}/hydra_sweeps
    subdir: ${hydra.job.num}
