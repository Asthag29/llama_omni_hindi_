data:
  json_path: "data/instruct/hindi_instruct_conversations.json"
  validation_ids_path: "data/splits/validation_ids.txt"
  test_ids_path: "data/splits/test_ids.txt"
  train_fraction: 1.0  # < 1.0: train on a random subset (debugging)
  val_fraction: 1.0
  seed: 42
  num_workers: 4

model:
  config_path: "models/llama"
  model_base: "models/llama"
  tokenizer_path: "models/llama"
  model_max_length: 2048

training:
  num_train_epochs: 3
  batch_size: 2 #!keep this
  gradient_accumulation_steps: 7  #forward and backward are accumulated over this steps and then the gradients are updated(sum of 8 microbatch)
  learning_rate: 1.0e-4
  tune_llm_backbone: true
  use_lora: true
  lora_r: 128  #128
  lora_alpha: 64  #64
  lora_dropout: 0.05
  gradient_checkpointing: true
  warmup_ratio: 0.05  #9% of the first epoch 
  weight_decay: 0.00
  max_grad_norm: 1.8   #clipping the gradients to prevent exploding gradients
  # Base model and forward pass follow this value; trainable weights and optimizer
  # state are always fp32. Do not use "bf16-true"/"16-true" (they cast everything).
  precision: "bf16-mixed"
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  log_every_n_steps: 20
  val_check_interval: 0.25
  fast_dev_run: false
  attn_implementation: "sdpa"

logging:
  output_dir: "outputs/stage_1/backbone_text"
  csv: true
  tensorboard: false
  wandb: true
  wandb_project: "hindi_llama_omni"
  wandb_run_id: null
  wandb_run_name: "stage-1-backbone-text"
  # Best = lowest val_loss. During a fit: checkpoints/best -> best-so-far weights (from
  # the first real validation), checkpoints/last -> latest validation (if save_last).
  # After a completed fit: best_model/ and final_model/.
  save_last: true

hydra:
  run:
    dir: ${logging.output_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${logging.output_dir}/hydra_sweeps
    subdir: ${hydra.job.num}
