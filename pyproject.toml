[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-omni-hindi"
version = "1.0.0"
description = "Speech-to-speech model for Hindi"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Astha Gupta" },
]
keywords = ["speech-to-speech", "hindi", "llama", "omni", "speech-language-model"]

dependencies = [
    # Core (inference)
    "torch==2.1.2",
    "torchaudio==2.1.2",
    # LLaMA-Omni's model code requires transformers 4.43.x.
    "transformers==4.43.4",
    "tokenizers==0.19.1",
    "huggingface-hub==0.36.2",
    "safetensors==0.8.0",
    "accelerate==0.33.0",
    "peft==0.11.1",
    "openai-whisper==20250625",
    "numpy==1.26.4",
    "soundfile==0.14.0",
    "PyYAML==6.0.3",
    "omegaconf==2.3.0",
    "packaging==26.2",
    "f5_tts @ git+https://github.com/AI4Bharat/IndicF5.git@13f7c4d627cc10111aea8fe9c0039462cacacdc7",

    # Serving
    "fastapi==0.112.4",
    "uvicorn==0.49.0",
    "requests==2.34.2",
    "gradio==4.43.0",
    "httpx==0.27.2",
    "pydantic==2.8.2",

    # Training
    "pytorch-lightning==2.2.5",
    "hydra-core==1.3.3",
    "datasets==5.0.0",
    "tensorboard==2.20.0",
    "wandb==0.27.2",
]

[project.optional-dependencies]
eval = [
    "bert-score==0.3.13",
    "lm-eval[ifeval] @ git+https://github.com/EleutherAI/lm-evaluation-harness.git@0cb92edba39621e2230bd4f1c5608e3b37aa8b8d",
    # The IFEval-Hi task imports pkg_resources, which newer setuptools no longer ships.
    "setuptools==79.0.1",
]
test = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["omni_speech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# uv only (pip ignores [tool.uv]): resolve torch/torchaudio to the CUDA 12.1 builds.
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
