[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-omni-hindi"
version = "1.0.0"
description = "Speech to Speech model for hindi language"
readme = "README.md"
requires-python = "==3.11.14"
authors = [
    { name = "Astha Gupta" },
]
keywords = ["speech-to-speech", "hindi", "llama", "omni", "speech-language-model"]

dependencies = [
    "torch==2.1.2", "torchvision==0.16.2", "torchaudio==2.1.2",
    "transformers==4.43.4", "tokenizers==0.19.1", "sentencepiece==0.1.99", "shortuuid",
    "accelerate==0.33.0", "peft==0.11.1",
    "pydantic", "markdown2[all]", "numpy", "scikit-learn==1.2.2",
    "PyYAML>=6.0", "pillow>=10.0.0",
    "gradio==4.43.0", "gradio_client==1.3.0",
    "requests", "httpx==0.27.2", "uvicorn", "fastapi", "soundfile",
    "einops>=0.8.0", "einops-exts==0.0.4", "timm==0.6.13",
    "openai-whisper", "setuptools==59.5.0", "omegaconf==2.3.0", "hydra-core",
    "datasets", "pyarrow", "huggingface_hub", "fsspec",
    "bert-score>=0.3.13", "langdetect>=1.0.9", "immutabledict>=4.3.1",
    "pytorch-lightning==2.2.5", "torchmetrics>=0.11,<2.0", "tensorboard>=2.14.0",
]

[project.optional-dependencies]
train = ["ninja", "wandb", "tensorboardX", "loguru>=0.7.0"]
build = ["build", "twine"]

[tool.setuptools.packages.find]
exclude = ["data", "checkpoints", "logs", "models", "fairseq"]
